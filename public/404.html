<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Codrithm</title>
    <style>
      :root {
        color: #111111;
        background: #fafafa;
        font-family: Geist, Arial, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(4rem, 14vw, 8rem);
        line-height: 0.9;
      }
      h2 {
        margin: 1.5rem 0 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0.75rem 0 0;
        color: #6b7280;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        margin-top: 1.75rem;
        border-radius: 9999px;
        background: #111111;
        padding: 0.8rem 1.2rem;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #87ffbc;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Go home</a>
    </main>
  </body>
</html>
